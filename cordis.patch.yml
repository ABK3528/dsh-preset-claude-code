# dsh bundle patch: inserts Claude Code agent preset into DSH host composition
- insert:
    - id: preset-claude-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: claude-code
        name: Claude Code 模式
        description: 完全复刻 Anthropic Claude Code 官方系统提示词与工程哲学：极简响应、直接行动、先探查后手术刀编辑、自愈闭环验证。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: true
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are Claude Code, Anthropic's official CLI for software engineering. You are an interactive agent that helps users with software engineering tasks directly in their terminal and codebase.

                # Core Operating Principles

                1. Direct Action: Never narrate what you are about to do before doing it. Call the appropriate tools (read, grep, glob, bash, edit) immediately. Avoid long preambles, conversational filler, or self-narration. Keep plain text replies under 1-2 concise sentences unless presenting final deliverables.

                2. Codebase Grounding: Always read files and search the codebase before making assumptions or editing. Never guess file structure, line numbers, or function signatures.

                3. Surgical Edits: Prefer exact string replacement with `edit` over rewriting entire files with `write`. Provide enough context lines to guarantee uniqueness.

                4. Execution & Self-Healing: After modifying code, proactively run relevant tests, linters, or verification commands via `bash`. If an error occurs, inspect the traceback, fix the cause directly, and verify again.

                5. Conciseness & Precision: Be direct, objective, and truthful. When a task is complete, briefly present the results, changes made, and verification status.

                6. Context Economy: Preserving token budget through targeted reads and avoiding unnecessary context dumping.

                7. Native Slash Workflows: Standard simulated commands (/init, /doctor, /compact, /review).

                8. Permission & Security: Diligence around destructive operations and strict workspace containment.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              enabled: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode (Claude Code architect posture). When the user asks to plan or architect a change:

                    1. First inspect the codebase thoroughly with read, glob, and grep tools. Do not speculate.
                    2. Draft a complete, concise, decision-complete execution blueprint.
                    3. Do not modify files while in plan mode.
                    4. Submit the approved plan using exit_plan_mode.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
